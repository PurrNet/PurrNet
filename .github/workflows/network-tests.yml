name: Network Tests

on:
  workflow_dispatch:
    inputs:
      clientCount:
        description: "Number of client processes to spawn"
        required: true
        default: "3"
      connectionDelaySeconds:
        description: "Seconds to wait after server starts before launching clients"
        required: true
        default: "1"
      timeoutMinutes:
        description: "Hard timeout for the whole job, in minutes"
        required: true
        default: "30"

jobs:
  network-tests:
    name: Build and run network test scenarios
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeoutMinutes) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Library cache
        id: cache-library
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-PurrNet-IL2CPP-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-PurrNet-IL2CPP-

      - name: Build StandaloneLinux64 player (IL2CPP)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: StandaloneLinux64
          buildName: PurrNetTests
          buildsPath: build
          unityVersion: auto
          # IL2CPP is slower to build than Mono but exercises the IL -> C++
          # converter against our codegen output, which surfaces issues that
          # Mono silently tolerates.
          customParameters: -standaloneBuildSubtarget Player -scriptingBackend IL2CPP

      - name: Save Library cache
        if: always() && steps.cache-library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Library
          key: ${{ steps.cache-library.outputs.cache-primary-key }}

      - name: Inspect build output
        run: ls -la build/StandaloneLinux64/

      - name: Run scenarios (1 server + N clients)
        env:
          CLIENT_COUNT: ${{ inputs.clientCount }}
          CONNECT_DELAY: ${{ inputs.connectionDelaySeconds }}
        run: |
          set -u
          BIN="$PWD/build/StandaloneLinux64/PurrNetTests"
          RESULTS_DIR="$PWD/test-results"
          LOGS_DIR="$PWD/test-logs"
          mkdir -p "$RESULTS_DIR" "$LOGS_DIR"

          # Unity 6 Linux player segfaults inside PlayerMain on ubuntu-latest
          # even with -batchmode -nographics, so wrap each invocation in xvfb-run.
          RUN=(xvfb-run -a --server-args="-screen 0 1024x768x24")

          echo "::group::Launching server"
          "${RUN[@]}" "$BIN" -batchmode -nographics \
            -role server -count "$CLIENT_COUNT" \
            -results "$RESULTS_DIR/server.json" \
            -logFile "$LOGS_DIR/server.log" &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          echo "::endgroup::"

          sleep "$CONNECT_DELAY"

          if ! kill -0 "$SERVER_PID" 2>/dev/null; then
            echo "::error::Server process died before clients could start"
            tail -n 200 "$LOGS_DIR/server.log" || true
            exit 1
          fi

          CLIENT_PIDS=()
          for i in $(seq 1 "$CLIENT_COUNT"); do
            echo "::group::Launching client $i"
            "${RUN[@]}" "$BIN" -batchmode -nographics \
              -role client \
              -results "$RESULTS_DIR/client-$i.json" \
              -logFile "$LOGS_DIR/client-$i.log" &
            PID=$!
            CLIENT_PIDS+=("$PID")
            echo "Client $i PID: $PID"
            echo "::endgroup::"
          done

          FAIL=0

          for pid in "${CLIENT_PIDS[@]}"; do
            if wait "$pid"; then
              echo "Client PID $pid exited 0"
            else
              code=$?
              echo "::error::Client PID $pid exited $code"
              FAIL=1
            fi
          done

          if wait "$SERVER_PID"; then
            echo "Server exited 0"
          else
            code=$?
            echo "::error::Server exited $code"
            FAIL=1
          fi

          echo "::group::Result files"
          for f in "$RESULTS_DIR"/*.json; do
            [ -e "$f" ] || continue
            echo "----- $f -----"
            cat "$f"
            echo
          done
          echo "::endgroup::"

          # Cross-check the JSON: any scenario with success=false fails the run.
          if command -v jq >/dev/null 2>&1; then
            for f in "$RESULTS_DIR"/*.json; do
              [ -e "$f" ] || continue
              if jq -e 'any(.[]; .result.success == false)' "$f" >/dev/null; then
                echo "::error::$f contains a failed scenario"
                FAIL=1
              fi
            done
          fi

          exit $FAIL

      - name: Render results to job summary
        if: always()
        run: |
          set -u
          shopt -s nullglob
          files=(test-results/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            {
              echo "## Network Test Results"
              echo ""
              echo "_No result files were produced._"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          JQ_LIB='
            def humanBytes:
              if . < 1024 then "\(.) B"
              elif . < 1048576 then "\(((. * 10) / 1024 | floor) / 10) KB"
              else "\(((. * 100) / 1048576 | floor) / 100) MB" end;
            def humanDuration:
              if . < 1000 then "\(((. * 10) | floor) / 10)ms"
              else "\(((. * 100) / 1000 | floor) / 100)s" end;
            def statusIcon:
              if . then ":white_check_mark:" else ":x:" end;
          '

          total=0
          passed=0
          for f in "${files[@]}"; do
            count=$(jq 'length' "$f")
            pass=$(jq '[.[] | select(.result.success == true)] | length' "$f")
            total=$((total + count))
            passed=$((passed + pass))
          done
          failed=$((total - passed))

          {
            echo "## Network Test Results"
            echo ""
            if [ "$failed" -eq 0 ]; then
              echo "### :white_check_mark: All scenarios passed (${passed}/${total})"
            else
              echo "### :x: ${failed} failure(s) — ${passed}/${total} passed"
            fi
            echo ""

            for f in "${files[@]}"; do
              proc=$(basename "$f" .json)
              pcount=$(jq 'length' "$f")
              ppass=$(jq '[.[] | select(.result.success == true)] | length' "$f")
              echo "#### \`${proc}\` — ${ppass}/${pcount} passed"
              echo ""
              echo "| # | Scenario | Status | Duration | Sent | Received | Message |"
              echo "|---|---|---|---|---|---|---|"
              jq -r "$JQ_LIB"'
                to_entries[] |
                "| \(.key) | \(.value.name // "?") | \(.value.result.success | statusIcon) | \(.value.durationInMs | humanDuration) | \(.value.dataSent | humanBytes) | \(.value.dataReceived | humanBytes) | \((.value.result.message // "") | gsub("\\|"; "&#124;") | gsub("[\\r\\n]+"; " ")) |"
              ' "$f"
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tail logs on failure
        if: failure()
        run: |
          for f in test-logs/*.log; do
            [ -e "$f" ] || continue
            echo "::group::$f (last 200 lines)"
            tail -n 200 "$f"
            echo "::endgroup::"
          done

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-test-artifacts
          path: |
            test-results/
            test-logs/
          if-no-files-found: warn
          retention-days: 14
