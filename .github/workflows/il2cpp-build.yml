name: IL2CPP Build Check

# Manually-triggered build that compiles the player with the IL2CPP scripting
# backend. The purpose is purely to catch IL/codegen issues that only surface
# when Unity converts our post-processed assemblies to C++. No tests are run.

on:
  workflow_dispatch:
    inputs:
      targetPlatform:
        description: "Target platform to IL2CPP-build"
        required: true
        default: "StandaloneLinux64"
        type: choice
        options:
          - StandaloneLinux64
          - StandaloneWindows64
          - StandaloneOSX
      timeoutMinutes:
        description: "Hard timeout for the whole job, in minutes"
        required: true
        default: "90"

jobs:
  il2cpp-build:
    name: IL2CPP build (${{ inputs.targetPlatform }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeoutMinutes) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore Library cache
        id: cache-library
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-PurrNet-IL2CPP-${{ inputs.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-PurrNet-IL2CPP-${{ inputs.targetPlatform }}-
            Library-PurrNet-IL2CPP-

      - name: Build player (IL2CPP)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: ${{ inputs.targetPlatform }}
          buildName: PurrNetIL2CPP
          buildsPath: build
          unityVersion: auto
          # Force the IL2CPP scripting backend so the build exercises the
          # IL -> C++ converter against our codegen output.
          customParameters: -standaloneBuildSubtarget Player -scriptingBackend IL2CPP

      - name: Save Library cache
        if: always() && steps.cache-library.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Library
          key: ${{ steps.cache-library.outputs.cache-primary-key }}

